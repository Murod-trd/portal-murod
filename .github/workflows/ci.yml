name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      DB_ENGINE: postgres
      POSTGRES_HOST: localhost
      POSTGRES_DB: portal_acceptance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-only-password
      PORTAL_RUNTIME_DIR: /tmp/portal-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install locked dependencies
        run: pip install --require-hashes -r requirements.lock -r requirements-dev.lock
      - name: Generate a throwaway secret key
        run: echo "DJANGO_SECRET_KEY=$(python -c 'import secrets;print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
      - name: Django checks and migration drift
        run: |
          python backend/manage.py check
          python backend/manage.py makemigrations --check --dry-run
      - name: Lint (errors only)
        run: ruff check --select E9,F backend operations scripts
      - name: Tests on PostgreSQL
        run: python -m pytest backend/tests -q -rs -p no:cacheprovider
      - name: Packager tests
        run: python -m unittest operations.test_package_release
  frontend:
    # The only place Node runs: CI (or a developer machine). Servers receive static files.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:web
      - run: npm run build:web
      - name: Verify the static bundle in Python, as the server image build does
        run: python operations/frontend_dist.py
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  release-package:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist
      - name: Package the release with the prebuilt frontend (no Node on the server)
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          python operations/package_release.py --include-frontend --output "$RUNNER_TEMP/release/toshkent-portal-$(cat RELEASE)-${GITHUB_SHA::12}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30
  server-images:
    # Proves the server images build from the prebuilt bundle without Node or npm.
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist
      - name: Build API and worker images
        run: |
          docker build --target api -t portal-ci-api .
          docker build --target worker -t portal-ci-worker .
      - name: Runtime images contain no Node or npm
        run: |
          for image in portal-ci-api portal-ci-worker; do
            docker run --rm --network none --entrypoint sh "$image" -ec '! command -v node && ! command -v npm && test -f frontend-dist/index.html'
          done
