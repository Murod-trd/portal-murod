name: ${COMPOSE_PROJECT_NAME:-toshkent-invest-portal}
x-labels: &labels
  org.toshkent.portal.installation: ${PORTAL_INSTALLATION_ID:?Installation identity required}
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: '3'}
x-build: &build
  context: .
  target: api
  args:
    PYTHON_IMAGE: ${PYTHON_IMAGE:?Pinned Python required}
    POSTGRES_IMAGE: ${POSTGRES_IMAGE:?Pinned PostgreSQL base required}
x-env: &env
  APP_ENV: production
  APP_ORIGIN: ${APP_ORIGIN:?Run portalctl configure}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Run portalctl configure},app
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Run portalctl configure}
  WORKER_TOKEN: ${WORKER_TOKEN:?Run portalctl configure}
  EDGE_PROXY_TOKEN: ${EDGE_PROXY_TOKEN:?Run portalctl configure}
  REQUIRE_MFA: ${REQUIRE_MFA:-none}
  REQUIRE_PASSWORD_CHANGE: ${REQUIRE_PASSWORD_CHANGE:-false}
  SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-43200}
  SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-43200}
  TRUST_HTTPS_PROXY: 'true'
  DB_ENGINE: postgres
  POSTGRES_HOST: postgres
  POSTGRES_DB: portal
  POSTGRES_USER: portal_app
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run portalctl configure}
  STORAGE_DRIVER: filesystem
  PRIVATE_STORAGE_DIR: /var/lib/portal/files
  MAX_UPLOAD_BYTES: 20971520
  MAX_UPLOAD_TOTAL_BYTES: 2147483648
  CLAMAV_HOST: clamav
  OCR_LANGUAGES: Latin+uzb_cyrl+rus+eng+tur
x-limits: &limits
  labels: *labels
  read_only: true
  tmpfs: ['/tmp:size=128m,mode=1777']
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *logging
services:
  postgres:
    labels: *labels
    image: ${PORTAL_IMAGE_PREFIX:-toshkent-invest-portal}-postgres:${PORTAL_RELEASE:?Release required}
    build:
      <<: *build
      target: postgres
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run portalctl configure}
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Run portalctl configure}
      POSTGRES_APP_PASSWORD: ${POSTGRES_PASSWORD:?Run portalctl configure}
    volumes: [postgres-data:/var/lib/postgresql/data, ./deploy/postgres/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro]
    networks: [database]
    command: [postgres, -c, log_statement=none, -c, log_min_error_statement=panic, -c, log_parameter_max_length_on_error=0, -c, log_error_verbosity=terse]
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U postgres -d portal]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 2g
    pids_limit: 256
    logging: *logging
    restart: unless-stopped
  migrate:
    <<: *limits
    image: ${PORTAL_IMAGE_PREFIX:-toshkent-invest-portal}-api:${PORTAL_RELEASE:?Release required}
    build: *build
    environment:
      <<: *env
      POSTGRES_USER: portal_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Run portalctl configure}
    command: [python, backend/manage.py, migrate, --noinput]
    networks: [database]
    volumes: [private-files:/var/lib/portal/files]
    depends_on: {postgres: {condition: service_healthy}}
  app:
    <<: *limits
    image: ${PORTAL_IMAGE_PREFIX:-toshkent-invest-portal}-api:${PORTAL_RELEASE:?Release required}
    build: *build
    environment: *env
    networks: [database, jobs, web]
    volumes: [private-files:/var/lib/portal/files]
    healthcheck:
      test: [CMD, python, operations/health.py, api-live]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 30s
    depends_on: {postgres: {condition: service_healthy}, migrate: {condition: service_completed_successfully}}
    mem_limit: 1g
    pids_limit: 128
    stop_grace_period: 70s
    restart: unless-stopped
  worker:
    <<: *limits
    init: true
    image: ${PORTAL_IMAGE_PREFIX:-toshkent-invest-portal}-worker:${PORTAL_RELEASE:?Release required}
    build:
      <<: *build
      target: worker
    environment:
      WORKER_TOKEN: ${WORKER_TOKEN:?Run portalctl configure}
      WORKER_API_URL: http://app:8000
      WORKER_HEALTH_FILE: /run/portal-worker/health.json
      CLAMAV_HOST: clamav
      OCR_LANGUAGES: Latin+uzb_cyrl+rus+eng+tur
      MAX_OCR_PAGES: 80
    networks: [jobs]
    healthcheck:
      test: [CMD, python, operations/health.py, worker]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on: {app: {condition: service_healthy}}
    tmpfs: ['/tmp:size=512m,mode=1777', '/run/portal-worker:size=1m,mode=0700,uid=10001,gid=10001']
    mem_limit: 2g
    cpus: 2
    pids_limit: 96
    stop_grace_period: 15s
    restart: unless-stopped
  clamav:
    labels: *labels
    environment: {TZ: UTC}
    image: ${CLAMAV_IMAGE:?Pinned ClamAV required}
    volumes: [clamav-data:/var/lib/clamav]
    networks: [jobs, signatures-egress]
    mem_limit: 3g
    pids_limit: 128
    logging: *logging
    restart: unless-stopped
  proxy:
    labels: *labels
    image: ${NGINX_IMAGE:?Pinned Nginx required}
    ports: ['${BIND_ADDRESS:?Private bind required}:${TLS_PORT:-443}:443']
    volumes: [./.deploy/nginx.conf:/etc/nginx/nginx.conf:ro, ./.deploy/tls:/etc/nginx/tls:ro]
    networks: [web, edge]
    depends_on: {app: {condition: service_healthy}}
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    mem_limit: 256m
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    logging: *logging
    restart: unless-stopped
  backup-tool:
    <<: *limits
    image: ${PORTAL_IMAGE_PREFIX:-toshkent-invest-portal}-api:${PORTAL_RELEASE:?Release required}
    entrypoint: [python]
    network_mode: none
    environment: {TMPDIR: /var/lib/portal/backup-work}
    volumes: [private-files:/var/lib/portal/files:ro, backup-work:/var/lib/portal/backup-work]
    logging: {driver: none}
    profiles: [tools]
  restore-tool:
    <<: *limits
    image: ${PORTAL_IMAGE_PREFIX:-toshkent-invest-portal}-api:${PORTAL_RELEASE:?Release required}
    entrypoint: [python]
    network_mode: none
    environment: {TMPDIR: /var/lib/portal/backup-work}
    volumes: [private-files:/var/lib/portal/files, backup-work:/var/lib/portal/backup-work]
    logging: {driver: none}
    profiles: [tools]
  verification:
    <<: *limits
    image: ${PORTAL_IMAGE_PREFIX:-toshkent-invest-portal}-verification:${PORTAL_RELEASE:?Release required}
    build:
      <<: *build
      target: verification
    environment:
      APP_ENV: test
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Run portalctl configure}
      WORKER_TOKEN: ${WORKER_TOKEN:?Run portalctl configure}
      DB_ENGINE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_DB: portal_acceptance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run portalctl configure}
      PORTAL_RUNTIME_DIR: /tmp/portal-native-tests
    networks: [database]
    profiles: [verification]
    tmpfs: ['/tmp:size=1g,mode=1777']
    mem_limit: 2g
    pids_limit: 256
    logging: {driver: none}
networks:
  database: {internal: true}
  jobs: {internal: true}
  web: {internal: true}
  signatures-egress: {}
  edge: {}
volumes:
  postgres-data: {labels: *labels}
  private-files: {labels: *labels}
  clamav-data: {labels: *labels}
  backup-work: {labels: *labels}
